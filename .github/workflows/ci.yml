name: MIANCAK CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      owner_approval_probe:
        description: Dummy owner approval probe on the review branch only
        type: string
        default: ''

run-name: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/protected-preview-ciphertext' && github.repository == 'AuroraLilja8514/miancak' && inputs.owner_approval_probe != '') && format('MIANCAK dummy {0}', inputs.owner_approval_probe) || '' }}

permissions:
  contents: read

env:
  MIANCAK_REVIEW_CI: ${{ github.repository == 'AuroraLilja8514/miancak' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/protected-preview-ciphertext') || (github.event_name == 'pull_request' && github.head_ref == 'review/repair-protected-preview-draft-access')) }}
  MIANCAK_SCRIPT_TIMEOUT_SECONDS: "3600"
  MIANCAK_ADB_TIMEOUT_SECONDS: "30"
  MIANCAK_INSTRUMENT_TIMEOUT_SECONDS: "900"
  MIANCAK_EMULATOR_BUILD_API23: "13823996"
  MIANCAK_EMULATOR_BUILD_API35: "16428233"
  # Keep the renderer that boots this pinned API 23 binary. The guest backend
  # was tested and failed OpenGLES initialization; retain bounded diagnostics.
  MIANCAK_EMULATOR_GPU_API23: swiftshader_indirect

concurrency:
  group: >-
    miancak-ci-${{
    (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/protected-preview-ciphertext' &&
    github.repository == 'AuroraLilja8514/miancak' && inputs.owner_approval_probe != '') &&
    (inputs.owner_approval_probe == 'start' && 'owner-probe-hold' || 'owner-probe-approve') ||
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/protected-preview-ciphertext' && github.repository == 'AuroraLilja8514/miancak' && inputs.owner_approval_probe != '') }}

jobs:
  # Independent host diagnostic. Its separate guest cannot gate app tests on
  # other hosts; real app upgrade/learning jobs still require actual reboots.
  emulator-reboot-check:
    if: &ordinary_ci ${{ !(github.repository == 'AuroraLilja8514/miancak' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/protected-preview-ciphertext') || (github.event_name == 'pull_request' && github.head_ref == 'review/repair-protected-preview-draft-access'))) }}
    name: emulator-reboot (23)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate three real guest reboots
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          system-image-api-level: 23
          emulator-build: ${{ env.MIANCAK_EMULATOR_BUILD_API23 }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-reboot-smoke
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu ${{ env.MIANCAK_EMULATOR_GPU_API23 }} -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: python3 scripts/emulator_reboot_smoke.py --timeout-seconds 900
      - name: Preserve reboot environment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reboot-${{ github.sha }}
          path: test-results/
          retention-days: 7

  generated:
    if: &review_checks_enabled ${{ !((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/protected-preview-ciphertext' && github.repository == 'AuroraLilja8514/miancak' && inputs.owner_approval_probe != '')) }}
    name: generated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - &review_guard
        name: Require exact trusted review and checked-out SHA
        if: env.MIANCAK_REVIEW_CI == 'true'
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'AuroraLilja8514/miancak'
          test "$GITHUB_REPOSITORY_ID" = 1355190124
          test "$GITHUB_ACTOR_ID" = 315702774
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              test "$GITHUB_REF" = 'refs/heads/review/protected-preview-ciphertext'
              test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
              ;;
            pull_request)
              python3 - <<'PY'
          import json
          import os
          import subprocess
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          pr = event["pull_request"]
          head = pr["head"]
          base = pr["base"]
          commit = os.environ["GITHUB_SHA"]
          number = event["number"]
          assert type(number) is int and number > 0 and pr["draft"] is True
          assert os.environ["GITHUB_REF"] == f"refs/pull/{number}/merge"
          assert event["repository"]["id"] == head["repo"]["id"] == base["repo"]["id"] == 1355190124
          assert head["ref"] == "review/repair-protected-preview-draft-access" and base["ref"] == "master"
          assert os.environ["GITHUB_WORKFLOW_SHA"] in (commit, head["sha"])
          header = subprocess.check_output(["git", "cat-file", "commit", commit], text=True).splitlines()
          parents = [line.removeprefix("parent ") for line in header[:header.index("")] if line.startswith("parent ")]
          assert parents == [base["sha"], head["sha"]]
          print(f"Verified PR #{number} head {head['sha']}, test merge {commit}, workflow {os.environ['GITHUB_WORKFLOW_SHA']}")
          PY
              ;;
            *) exit 1 ;;
          esac

      - name: Regenerate checked-in files
        shell: bash
        run: |
          python3 gen_layouts.py
          python3 scripts/gen_phonetic_pages.py
          python3 scripts/test_phonetic_pages.py
          python3 scripts/check_word_table_fixtures.py
          python3 scripts/audit_fn_baseline.py
          python3 scripts/test_fn_baseline.py
          python3 scripts/test_script_timeouts.py --timeout-seconds 120
          python3 scripts/test_emulator_reboot_smoke.py --timeout-seconds 120
          python3 check_layout.py
          python3 srcs/compose/compile.py srcs/compose/{*.json,compose} > srcs/juloo.keyboard2/ComposeKeyData.java
          python3 gen_method_xml.py > res/xml/method.xml

      - name: Verify generated files are current
        run: git diff --exit-code

      - name: Test protected preview CLI with no credentials
        if: env.MIANCAK_REVIEW_CI == 'true' && github.event_name == 'pull_request'
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/protected-preview/test_preview_cli.py --timeout-seconds 40

  unit:
    if: *review_checks_enabled
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - *review_guard

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ env.MIANCAK_REVIEW_CI == 'true' }}

      - name: Cache locked native sources
        if: *ordinary_ci
        uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}

      - name: Prepare pinned Rime sources and data
        run: python3 scripts/prepare_rime.py

      - name: Run unit tests and compile Android test driver
        run: |
          mkdir -p build/generated-resources/xml build/generated-resources/raw
          echo '<keyboard/>' > build/generated-resources/xml/latn_legacy_probe.xml
          echo '<keyboard/>' > build/generated-resources/raw/latn_legacy_probe.xml
          ./gradlew --no-daemon test compileDebugAndroidTestJavaWithJavac
          test ! -e build/generated-resources/xml/latn_legacy_probe.xml
          test ! -e build/generated-resources/raw/latn_legacy_probe.xml
          cmp srcs/layouts/miancak_qwerty.xml build/generated-resources/xml/miancak_qwerty.xml
          cmp srcs/layouts/miancak_qwerty.xml build/generated-resources/raw/miancak_qwerty.xml
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(path).getroot() for path in Path("build/test-results").rglob("TEST-*.xml")]
          for suite in suites:
              print(f"{suite.attrib['name']}: {suite.attrib['tests']} tests, {suite.attrib['failures']} failures, {suite.attrib['errors']} errors")
          print("Total unit tests:", sum(int(suite.attrib["tests"]) for suite in suites))
          PY

      - name: Verify tests did not leave stale generated files
        run: git diff --exit-code

      - name: Upload unit test reports
        if: ${{ always() && !(github.repository == 'AuroraLilja8514/miancak' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/protected-preview-ciphertext') || (github.event_name == 'pull_request' && github.head_ref == 'review/repair-protected-preview-draft-access'))) }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-results-${{ github.sha }}
          path: build/test-results/
          retention-days: 7

  build-debug:
    if: *review_checks_enabled
    name: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - *review_guard

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ env.MIANCAK_REVIEW_CI == 'true' }}

      - name: Cache locked native sources
        if: *ordinary_ci
        uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}

      - name: Prepare pinned Rime sources and data
        run: python3 scripts/prepare_rime.py

      - name: Cache native build objects
        if: *ordinary_ci
        uses: actions/cache@v4
        with:
          path: |
            .cxx
            build/intermediates/cxx
          key: native-debug-objects-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt', 'native/rime_jni.cc', 'native/sources.lock.json', 'native/cmake/**') }}
          restore-keys: |
            native-debug-objects-${{ runner.os }}-
            native-objects-${{ runner.os }}-

      - name: Build debug APK and instrumented tests
        run: |
          ./gradlew --no-daemon -PmiancakVersionCode=2 assembleDebug
          mkdir -p build/word-upgrade-fixture
          cp build/outputs/apk/debug/*.apk build/word-upgrade-fixture/baseline.apk
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Verify packaged native runtime
        run: |
          python3 scripts/check_native_apk.py build/outputs/apk/debug/*.apk
          python3 scripts/check_native_apk.py build/word-upgrade-fixture/baseline.apk

      - name: Upload feature-enabled upgrade fixture
        if: *ordinary_ci
        uses: actions/upload-artifact@v7
        with:
          name: miancak-word-baseline-${{ github.sha }}
          path: build/word-upgrade-fixture/baseline.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        if: *ordinary_ci
        uses: actions/upload-artifact@v7
        with:
          name: miancak-debug-${{ github.sha }}
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  build-release:
    if: *ordinary_ci
    name: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cache locked native sources
        uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}
      - name: Prepare pinned Rime sources and data
        run: python3 scripts/prepare_rime.py
      - name: Cache release native build objects
        uses: actions/cache@v4
        with:
          path: |
            .cxx
            build/intermediates/cxx
          key: native-release-objects-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt', 'native/rime_jni.cc', 'native/sources.lock.json', 'native/cmake/**') }}
          restore-keys: |
            native-release-objects-${{ runner.os }}-
            native-objects-${{ runner.os }}-
      - name: Build and verify minified release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          python3 scripts/check_native_apk.py build/outputs/apk/release/*.apk --release
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: miancak-unsigned-release-${{ github.sha }}
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  interaction-tests:
    if: *ordinary_ci
    name: interaction-tests (${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    needs: [build-debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download
      - name: Gather APKs
        run: |
          mkdir -p artifacts
          find artifacts-download -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android offline native and interaction tests
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          emulator-build: ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_BUILD_API23 || env.MIANCAK_EMULATOR_BUILD_API35 }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-interactions
          force-avd-creation: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-interactions.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_GPU_API23 || 'swangle' }} -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: MIANCAK_TEST_API=${{ matrix.api }} bash scripts/emulator_tests.sh
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-results-api-${{ matrix.api }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  word-pack-quality:
    if: *ordinary_ci
    name: word-pack-quality (${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    needs: [build-debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download
      - name: Gather APKs
        run: |
          mkdir -p artifacts
          find artifacts-download -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare pinned word packs through actual JNI
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          emulator-build: ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_BUILD_API23 || env.MIANCAK_EMULATOR_BUILD_API35 }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-quality
          force-avd-creation: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-quality.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_GPU_API23 || 'swangle' }} -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: MIANCAK_TEST_API=${{ matrix.api }} bash scripts/word_pack_quality_tests.sh
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: word-pack-quality-api-${{ matrix.api }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  first-install:
    if: *ordinary_ci
    name: first-install (${{ matrix.api }}, ${{ matrix.entry }})
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
        entry: [settings-first, ime-first]
    needs: [build-debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download
      - name: Gather delivered APKs
        run: |
          mkdir -p artifacts
          find artifacts-download -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Previously unused phone image and normal Android enablement
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          emulator-build: ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_BUILD_API23 || env.MIANCAK_EMULATOR_BUILD_API35 }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-clean
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-clean.avd/config.ini"
          emulator-options: -no-window -gpu ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_GPU_API23 || 'swangle' }} -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: MIANCAK_TEST_API=${{ matrix.api }} MIANCAK_ENTRY_ORDER=${{ matrix.entry }} bash scripts/first_install_tests.sh
      - name: Upload first-install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-install-api-${{ matrix.api }}-${{ matrix.entry }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  word-table-tests:
    if: *ordinary_ci
    name: word-table-tests (${{ matrix.api }})
    needs: [build-debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download/current
      - uses: actions/download-artifact@v8
        with:
          name: miancak-word-baseline-${{ github.sha }}
          path: artifacts-download/fixture
      - name: Gather actual APKs
        run: |
          mkdir -p artifacts
          find artifacts-download/current -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download/current -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
          cp artifacts-download/fixture/baseline.apk artifacts/word-baseline.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Import actual tables, replace APK and reboot
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          emulator-build: ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_BUILD_API23 || env.MIANCAK_EMULATOR_BUILD_API35 }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-words
          force-avd-creation: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-words.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_GPU_API23 || 'swangle' }} -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: MIANCAK_TEST_API=${{ matrix.api }} bash scripts/word_table_apk_tests.sh
      - name: Upload vocabulary acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: word-table-results-api-${{ matrix.api }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  build-upgrade-baseline:
    if: *ordinary_ci
    name: build-upgrade-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ca6c0b309306767e434ce922e4a3409c7093e8b9
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}
      - run: timeout --foreground --kill-after=10s "${MIANCAK_SCRIPT_TIMEOUT_SECONDS}s" python3 scripts/prepare_rime.py
      - uses: actions/cache@v4
        with:
          path: |
            .cxx
            build/intermediates/cxx
          key: upgrade-baseline-ca6c-x86_64-${{ runner.os }}
      - name: Build pinned old application APK
        run: |
          timeout --foreground --kill-after=10s "${MIANCAK_SCRIPT_TIMEOUT_SECONDS}s" ./gradlew --no-daemon -PmiancakAbis=x86_64 assembleDebug
          mkdir -p baseline
          cp build/outputs/apk/debug/*.apk baseline/baseline.apk
          git rev-parse HEAD > baseline/source-commit.txt
          sha256sum baseline/baseline.apk > baseline/apk-sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: miancak-upgrade-baseline-${{ github.sha }}
          path: baseline/
          if-no-files-found: error
          retention-days: 7

  upgrade-tests:
    if: *ordinary_ci
    name: upgrade-tests (${{ matrix.api }})
    needs: [build-debug, build-upgrade-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download/current
      - uses: actions/download-artifact@v8
        with:
          name: miancak-upgrade-baseline-${{ github.sha }}
          path: artifacts-download/baseline
      - name: Gather actual APKs
        run: |
          mkdir -p artifacts
          find artifacts-download/current -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download/current -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
          cp artifacts-download/baseline/baseline.apk artifacts/baseline.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade actual APK and reboot guest
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: ${{ matrix.api }}
          emulator-build: ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_BUILD_API23 || env.MIANCAK_EMULATOR_BUILD_API35 }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-upgrade
          force-avd-creation: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-upgrade.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api == 23 && env.MIANCAK_EMULATOR_GPU_API23 || 'swangle' }} -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: bash scripts/upgrade_apk_tests.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upgrade-results-api-${{ matrix.api }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  inbound-smoke-build:
    name: Hold synthetic preview inputs
    needs: generated
    if: >-
      !cancelled() && github.repository == 'AuroraLilja8514/miancak' &&
      github.event_name == 'workflow_dispatch' && inputs.owner_approval_probe == '' &&
      github.ref == 'refs/heads/review/protected-preview-ciphertext' &&
      github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/protected-preview
      - name: Stage only synthetic bytes and a digest receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/miancak-input-smoke"
          mkdir "$stage"
          python3 tools/protected-preview/smoke_inputs.py stage --stage "$stage" --timeout-seconds 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-smoke-inbound-input-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/miancak-input-smoke/receipt/receipt.json
          retention-days: 1
          overwrite: false
          if-no-files-found: error
      - name: Encrypt synthetic inputs for the authenticated receiver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/miancak-input-smoke"
          python3 tools/protected-preview/install_handoff_tools.py "$stage/tools"
          python3 tools/protected-preview/smoke_inputs.py seal --stage "$stage" --timeout-seconds 500
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-smoke-inbound-input-ciphertext-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/miancak-input-smoke/inputs.age
          retention-days: 1
          overwrite: false
          if-no-files-found: error
      - name: Clear synthetic input staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/miancak-input-smoke"

  inbound-smoke-approval:
    name: Approve synthetic receipt
    needs: generated
    if: >-
      !cancelled() && github.repository == 'AuroraLilja8514/miancak' &&
      github.event_name == 'workflow_dispatch' && inputs.owner_approval_probe == '' &&
      github.ref == 'refs/heads/review/protected-preview-ciphertext' &&
      github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/protected-preview
      - name: Check the in-progress dummy receipt and actual three-job overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 tools/protected-preview/smoke_inputs.py approve --stage "$RUNNER_TEMP" --timeout-seconds 370

  inbound-smoke-gate:
    name: Authorize synthetic inputs
    needs: generated
    if: >-
      !cancelled() && github.repository == 'AuroraLilja8514/miancak' &&
      github.event_name == 'workflow_dispatch' && inputs.owner_approval_probe == '' &&
      github.ref == 'refs/heads/review/protected-preview-ciphertext' &&
      github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/protected-preview
      - name: Bind the dummy authorization to the successful same-attempt approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 tools/protected-preview/smoke_inputs.py gate --stage "$RUNNER_TEMP" --timeout-seconds 385

  inbound-smoke-receive:
    name: Receive synthetic preview inputs
    needs: inbound-smoke-gate
    if: >-
      !cancelled() && needs.inbound-smoke-gate.result == 'success' &&
      github.repository == 'AuroraLilja8514/miancak' &&
      github.event_name == 'workflow_dispatch' && inputs.owner_approval_probe == '' &&
      github.ref == 'refs/heads/review/protected-preview-ciphertext' &&
      github.actor == github.repository_owner && github.run_attempt == 1
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/protected-preview-inbound-smoke.yml

  owner-smoke-hold:
    name: Hold synthetic owner receipt
    if: >-
      github.repository == 'AuroraLilja8514/miancak' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/review/protected-preview-ciphertext' &&
      github.actor == github.repository_owner && github.run_attempt == 1 &&
      inputs.owner_approval_probe == 'start'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - &owner_smoke_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/protected-preview
      - name: Stage the literal dummy receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/protected-preview/smoke_owner.py stage --stage "$RUNNER_TEMP" --timeout-seconds 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-smoke-owner-input-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-smoke-receipt/receipt.json
          retention-days: 1
          overwrite: false
          if-no-files-found: error
      - name: Require successful approval from a distinct owner run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/protected-preview/smoke_owner.py wait --stage "$RUNNER_TEMP" --timeout-seconds 400

  owner-smoke-approve:
    name: Confirm synthetic owner approval
    if: >-
      github.repository == 'AuroraLilja8514/miancak' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/review/protected-preview-ciphertext' &&
      github.actor == github.repository_owner && github.run_attempt == 1 &&
      startsWith(inputs.owner_approval_probe, 'approve-inputs ')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - *owner_smoke_checkout
      - name: Verify the exact in-progress dummy receipt and approval origin
        env:
          GH_TOKEN: ${{ github.token }}
          MIANCAK_OWNER_PROBE: ${{ inputs.owner_approval_probe }}
        run: python3 tools/protected-preview/smoke_owner.py approve --stage "$RUNNER_TEMP" --timeout-seconds 110

# Review-only source. See docs/PROTECTED_PRERELEASE.md before adoption.
name: MIANCAK protected prerelease
run-name: v0.3.4-preview.1 ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [build, publish]
        required: true
      build_run_id:
        description: Completed preview build run ID (publish only)
        type: string
      build_artifact_id:
        description: Unsigned preview artifact ID (publish only)
        type: string
      approval_sha256:
        description: Reviewed build attestation SHA-256 (publish only)
        type: string

permissions: {}
concurrency:
  group: miancak-protected-preview-v0.3.4-preview.1
  cancel-in-progress: false
env:
  CANDIDATE: 30b074bf08ba7e668761874b41819781a3f4d44f
  PREVIEW_MODE: ${{ inputs.mode }}
  JAVA_TOOL_OPTIONS: ''
  _JAVA_OPTIONS: ''
  JDK_JAVA_OPTIONS: ''

jobs:
  build:
    if: >-
      github.repository == 'AuroraLilja8514/miancak' &&
      github.ref == 'refs/heads/master' && github.run_attempt == 1 &&
      github.actor == github.repository_owner && inputs.mode == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE }}
          path: candidate
          submodules: true
          persist-credentials: false
      - name: Check candidate checkout and admitted tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/tools/protected-preview/preview_ops.py build-check --folder candidate
      - name: Build the exact application and separate debug driver
        working-directory: candidate
        env:
          MIANCAK_SCRIPT_TIMEOUT_SECONDS: '1800'
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
          python3 scripts/prepare_rime.py
          ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest
          python3 scripts/check_native_apk.py build/outputs/apk/release/*.apk --release
          stage="$RUNNER_TEMP/miancak-preview-unsigned"
          mkdir "$stage"
          cp build/outputs/apk/release/*.apk "$stage/unsigned.apk"
          cp build/outputs/apk/debug/*.apk "$stage/app-debug.apk"
          cp build/outputs/apk/androidTest/debug/*.apk "$stage/app-debug-androidTest.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: preview-unsigned-${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/miancak-preview-unsigned/*.apk
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Attest the actual unsigned bytes and debug fixtures on a clean runner
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT: ${{ needs.build.outputs.artifact_id }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          python3 tools/protected-preview/preview_ops.py attest --run-id "$GITHUB_RUN_ID" --artifact-id "$BUILD_ARTIFACT" --folder "$RUNNER_TEMP/miancak-preview-attestation"

  sign-and-accept:
    name: Accept signed preview
    if: >-
      github.repository == 'AuroraLilja8514/miancak' &&
      github.ref == 'refs/heads/master' && github.run_attempt == 1 &&
      github.actor == github.repository_owner && inputs.mode == 'publish'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Bind owner-approved attestation, SDK tools and the real stable APK
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          BUILD_ARTIFACT: ${{ inputs.build_artifact_id }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/miancak-preview"
          mkdir "$stage"
          python3 tools/protected-preview/install_handoff_tools.py "$stage/tools"
          python3 tools/protected-preview/handoff.py await-recipient --stage "$stage" --timeout-seconds 420
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          python3 tools/protected-preview/preview_ops.py prepare --run-id "$BUILD_RUN" --artifact-id "$BUILD_ARTIFACT" --folder "$stage/prepared"
          python3 - "$stage" <<'PY'
          import pathlib, re, sys, textwrap
          root = pathlib.Path(sys.argv[1])
          workflow = pathlib.Path(".github/workflows/signing-credentials.yml").read_text()
          java = re.search(r"^          // MIANCAK_CREDENTIAL_PROBE_BEGIN\n(.*?)^          // MIANCAK_CREDENTIAL_PROBE_END$", workflow, re.M | re.S)
          assert java
          (root / "MiancakCredentialProbe.java").write_text(textwrap.dedent(java[1]))
          PY
          "$JAVA_HOME_17_X64/bin/javac" -encoding UTF-8 -d "$stage" "$stage/MiancakCredentialProbe.java"
      - name: Sign with the registered production certificate in runner-local staging
        env:
          PREVIEW_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
          MIANCAK_RELEASE_KEYSTORE_B64: ${{ secrets.MIANCAK_RELEASE_KEYSTORE_B64 }}
          MIANCAK_RELEASE_STORE_PASSWORD: ${{ secrets.MIANCAK_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          stage="$RUNNER_TEMP/miancak-preview"
          python3 tools/protected-preview/preview_ops.py sign --prepared "$stage/prepared" --folder "$stage/signed" --probe-classes "$stage"
      - name: Enable KVM for the Android 15 acceptance guest
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Require signed upgrade, online setup, offline input and reboot before handoff
        env:
          MIANCAK_TEST_DISPOSABLE_GUEST: 'true'
          MIANCAK_SCRIPT_TIMEOUT_SECONDS: '1200'
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 35
          system-image-api-level: 35
          emulator-build: '16428233'
          arch: x86_64
          target: google_apis
          avd-name: miancak-release-35
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-release-35.avd/config.ini"
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: >-
            cd "$RUNNER_TEMP/miancak-preview" &&
            umask 077 &&
            python3 "$GITHUB_WORKSPACE/tools/protected-preview/preview_device.py" prepared signed > acceptance-private.log 2>&1
      - name: Seal the accepted APK and encrypt it for the authenticated publisher
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/miancak-preview"
          python3 tools/protected-preview/preview_ops.py seal --folder "$stage/signed" --report "$stage/test-results/release/acceptance.json"
          python3 tools/protected-preview/handoff.py encrypt --stage "$stage" --timeout-seconds 260
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: ciphertext-proof
        with:
          subject-path: ${{ runner.temp }}/miancak-preview/ciphertext/accepted.age
          predicate-type: https://github.com/AuroraLilja8514/miancak/provenance/preview-handoff/v1
          predicate: '{"role":"ciphertext"}'
          show-summary: false
      - name: Stage the ciphertext and its attestation
        env:
          CIPHERTEXT_PROOF: ${{ steps.ciphertext-proof.outputs.bundle-path }}
        run: cp -- "$CIPHERTEXT_PROOF" "$RUNNER_TEMP/miancak-preview/ciphertext/proof.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-ciphertext-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/miancak-preview/ciphertext/accepted.age
            ${{ runner.temp }}/miancak-preview/ciphertext/proof.json
          overwrite: false
          if-no-files-found: error
          retention-days: 1
      - name: Clear runner-local signing and Android acceptance staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/miancak-preview"

  publish:
    name: Publish preview
    if: >-
      github.repository == 'AuroraLilja8514/miancak' &&
      github.ref == 'refs/heads/master' && github.run_attempt == 1 &&
      github.actor == github.repository_owner && inputs.mode == 'publish'
    uses: ./.github/workflows/protected-preview-publisher.yml
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      approval_sha256: ${{ inputs.approval_sha256 }}

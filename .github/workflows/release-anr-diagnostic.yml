name: Exact APK ANR diagnostic

# Temporary, non-release experiment for the observed API23 ANR in PR #36.
# Keep this branch/PR a draft. Its pinned public input expires on 2026-11-18;
# retain the collector after review, not this expiring diagnostic workflow.
on:
  pull_request:
    paths:
      - tools/release/device_smoke.py
      - tools/release/test_device_diagnostics.py
      - .github/workflows/release-anr-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: exact-apk-anr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-api23-anr:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true && github.head_ref == 'test/release-anr-evidence' && github.base_ref == 'fix/default-keyboard-preferences'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the bounded failure collector
        timeout-minutes: 2
        run: python tools/release/test_device_diagnostics.py --timeout-seconds 120
      - name: Retrieve the exact public APK that produced the observed ANR
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release/release_ops.py fetch \
            --artifact-id 14223956713 --run-id 43860412249 \
            --digest sha256:2b8a08c5a24dc1ab2270790fdc00db0273a8dd7cd4d196e3502d6bbb118ccd2c \
            --output rehearsal
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/release')
          import release_ops as ops
          record = json.loads(Path('rehearsal/prepared.json').read_text())
          assert record['disposable_key'] is True
          assert record['source_sha'] == '70eecc40057873850af94ded122a879e3e75c672'
          assert record['application_tree_sha256'] == ops.application_fingerprint()
          assert record['certificate_sha256'] != ops.CERTIFICATE
          evidence = {
              'purpose': 'unchanged-APK replay on a synthetic guest; read-only failure evidence; no product fix or signing',
              'application_head_sha': '0e28e746e6cd4b4a3a8f3322c06efcead57e80c8',
              'application_merge_sha': record['source_sha'],
              'diagnostic_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'input_run_id': 43860412249, 'input_artifact_id': 14223956713,
              'input_artifact_sha256': '2b8a08c5a24dc1ab2270790fdc00db0273a8dd7cd4d196e3502d6bbb118ccd2c',
              'application_tree_sha256': record['application_tree_sha256'],
          }
          out = Path('test-results/release'); out.mkdir(parents=True, exist_ok=True)
          (out / 'diagnostic-input.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print('PASS: EXACT_DISPOSABLE_APK_INPUT_AND_UNCHANGED_APPLICATION_TREE')
          PY
      - name: Enable KVM on this disposable runner
        timeout-minutes: 1
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Repeat the unchanged APK scenario and retain any genuine failure
        timeout-minutes: 26
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 35
          system-image-api-level: 23
          emulator-build: '13823996'
          arch: x86_64
          target: google_apis
          avd-name: miancak-release-rehearsal-23
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-release-rehearsal-23.avd/config.ini"
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: python tools/release/rehearsal.py device --folder rehearsal --api 23 --timeout-seconds 1200
      - name: Preserve bounded synthetic evidence, including failed gates
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exact-apk-anr-api23-${{ github.sha }}
          path: test-results/release/
          retention-days: 7

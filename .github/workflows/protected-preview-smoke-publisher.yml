name: Receive synthetic ciphertext
on: workflow_call

permissions: {}
jobs:
  receive:
    name: Verify synthetic bytes
    if: >-
      github.repository == 'AuroraLilja8514/miancak' &&
      github.ref == 'refs/heads/review/protected-preview-ciphertext' &&
      github.event_name == 'push' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/protected-preview
      - name: Prepare pinned tools and a run-local age identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/miancak-preview-smoke"
          mkdir "$stage"
          python3 tools/protected-preview/install_handoff_tools.py "$stage/tools"
          python3 tools/protected-preview/smoke_handoff.py recipient --stage "$stage" --timeout-seconds 90
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: recipient-proof
        with:
          subject-path: ${{ runner.temp }}/miancak-preview-smoke/recipient/recipient.json
          predicate-type: https://github.com/AuroraLilja8514/miancak/provenance/preview-handoff/v1
          predicate: '{"role":"recipient"}'
          show-summary: false
      - name: Stage only the public recipient and its proof
        env:
          RECIPIENT_PROOF: ${{ steps.recipient-proof.outputs.bundle-path }}
        run: cp -- "$RECIPIENT_PROOF" "$RUNNER_TEMP/miancak-preview-smoke/recipient/proof.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-smoke-recipient-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/miancak-preview-smoke/recipient/recipient.json
            ${{ runner.temp }}/miancak-preview-smoke/recipient/proof.json
          overwrite: false
          if-no-files-found: error
          retention-days: 1
      - name: Require successful sender, decrypt and check exact synthetic bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 tools/protected-preview/smoke_handoff.py receive --stage "$RUNNER_TEMP/miancak-preview-smoke" --timeout-seconds 600
      - name: Clear the run-local age identity
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/miancak-preview-smoke"

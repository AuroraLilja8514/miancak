# MIANCAK schema: explicit literal punctuation/digits are routed by the frontend.
# Dictionary: rime/rime-pinyin-simp (Apache-2.0), unmodified, pinned by sources.lock.json.
schema:
  schema_id: miancak_pinyin_private
  name: MIANCAK 简体拼音（不学习）
  version: '1.0'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: "'"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
translator:
  dictionary: pinyin_simp
  enable_user_dict: false
  enable_sentence: true
  enable_completion: true
menu:
  page_size: 10

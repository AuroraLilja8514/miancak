# MIANCAK schema: explicit literal punctuation/digits are routed by the frontend.
# Stable dictionary ID: pinyin_simp. Pack provenance is in word-pack/current.json;
# source revisions, licenses and preserved headers are packaged under third-party/.
schema:
  schema_id: miancak_pinyin
  name: MIANCAK 简体拼音
  version: '1.0'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: "'"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
translator:
  dictionary: pinyin_simp
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
menu:
  page_size: 10

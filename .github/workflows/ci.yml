name: MIANCAK CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miancak-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: generated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Regenerate checked-in files
        shell: bash
        run: |
          python3 gen_layouts.py
          python3 check_layout.py
          python3 srcs/compose/compile.py srcs/compose/{*.json,compose} > srcs/juloo.keyboard2/ComposeKeyData.java
          python3 gen_method_xml.py > res/xml/method.xml

      - name: Verify generated files are current
        run: git diff --exit-code

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache locked native sources
        uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}

      - name: Prepare pinned Rime sources and data
        run: python3 scripts/prepare_rime.py

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Verify tests did not leave stale generated files
        run: git diff --exit-code

  build-debug:
    name: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache locked native sources
        uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}

      - name: Prepare pinned Rime sources and data
        run: python3 scripts/prepare_rime.py

      - name: Cache native build objects
        uses: actions/cache@v4
        with:
          path: |
            .cxx
            build/intermediates/cxx
          key: native-objects-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt', 'native/rime_jni.cc', 'native/sources.lock.json', 'native/cmake/**') }}
          restore-keys: native-objects-${{ runner.os }}-

      - name: Build debug APK and instrumented tests
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Verify packaged native runtime
        run: python3 scripts/check_native_apk.py build/outputs/apk/debug/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: miancak-debug-${{ github.sha }}
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  interaction-tests:
    name: interaction-tests
    needs: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download
      - name: Gather APKs
        run: |
          mkdir -p artifacts
          find artifacts-download -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android offline native and interaction tests
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash scripts/emulator_tests.sh
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-results-${{ github.sha }}
          path: instrumentation.log
          retention-days: 7

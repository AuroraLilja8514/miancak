name: Focused release diagnosis
on:
  push:
    branches: [ci/release-evidence]
permissions:
  contents: read
  actions: read
jobs:
  frozen-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve the exact existing public test copy, without building or signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/release_ops.py fetch --artifact-id 13053905448 --run-id 41229702734 --digest 853e2746cd70477439c66974514726301f591ee1b0b77fc18f997c4869e7f043 --output rehearsal
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce on API 23 and collect the application's ANR stack
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 35
          system-image-api-level: 23
          emulator-build: '13823996'
          arch: x86_64
          target: google_apis
          avd-name: miancak-release-diagnosis
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-release-diagnosis.avd/config.ini"
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: python tools/release/diagnose_guest.py --api 23 --timeout-seconds 1200
      - name: Preserve synthetic evidence and own-process traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: focused-release-diagnosis-${{ github.sha }}
          path: test-results/release/
          retention-days: 7

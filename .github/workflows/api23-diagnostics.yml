name: MIANCAK API 23 diagnostics

on:
  push:
    branches: [test/api23-diagnostic-20261027]

permissions:
  contents: read
  actions: read

concurrency:
  group: miancak-api23-diagnostics
  cancel-in-progress: true

env:
  MIANCAK_SCRIPT_TIMEOUT_SECONDS: "3600"
  MIANCAK_ADB_TIMEOUT_SECONDS: "30"
  MIANCAK_INSTRUMENT_TIMEOUT_SECONDS: "900"

jobs:
  same-apk-api23:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate timed collectors including Android 6 CRLF
        run: python3 scripts/test_script_timeouts.py --timeout-seconds 120
      # This archival diagnostic deliberately freezes both APKs from CI 133.
      # It is not a production workflow or a rebuild of the application.
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-92acd6521e8316eb3090d9bf5e4144dacfc1f38c
          run-id: 40445163115
          github-token: ${{ github.token }}
          path: artifacts-download
      - name: Verify and reuse the exact application and test APKs
        run: |
          python3 scripts/run_with_timeout.py --timeout-seconds 30 -- python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil
          pairs = [
            ('debug/MIANCAK-debug.apk', 'app-debug.apk', '9a21b2c0e0d2ef60e8c7f74df1d86679410ac6b7d0880b280f785b47451a87c5'),
            ('androidTest/debug/MIANCAK-debug-androidTest.apk', 'app-debug-androidTest.apk', '4eed615490cc499f95d8948333ce320ac4a6554a07830ccfdea11358e1c46f2c')]
          Path('artifacts').mkdir(exist_ok=True)
          Path('test-results').mkdir(exist_ok=True)
          proof = {'applicationSource': 'b0f14a2549fda14318bcaeba98a25bbdc82fadc6',
                   'sourceRunId': 40445163115, 'sourceArtifactId': 12708476740,
                   'diagnosticSource': os.environ['GITHUB_SHA'], 'apks': []}
          for original, name, expected in pairs:
            source = Path('artifacts-download') / original
            actual = hashlib.sha256(source.read_bytes()).hexdigest()
            assert actual == expected, (original, actual)
            shutil.copyfile(source, Path('artifacts') / name)
            proof['apks'].append({'name': name, 'sha256': actual})
          Path('test-results/source-apks.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the unchanged complete native and interaction scenario
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          system-image-api-level: 23
          emulator-build: "13823996"
          arch: x86_64
          target: google_apis
          avd-name: miancak-interactions
          force-avd-creation: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-interactions.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: MIANCAK_TEST_API=23 bash scripts/emulator_tests.sh
      - name: Preserve exact-APK receiver and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api23-diagnostic-${{ github.sha }}
          path: test-results/
          retention-days: 7

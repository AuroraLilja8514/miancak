name: API 23 emulator build comparison
on:
  push:
    branches: [ci/api23-emulator-compare-20261111]
permissions:
  contents: read
jobs:
  reboot-comparison:
    name: reboot (${{ matrix.profile }}, ${{ matrix.trial }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, newer-swiftshader, newer-swangle]
        trial: [1, 2]
        include:
          - profile: baseline
            build: "13823996"
            version: "36.1.9"
            gpu: swiftshader_indirect
          - profile: newer-swiftshader
            build: "16428233"
            version: "37.2.12"
            gpu: swiftshader_indirect
          - profile: newer-swangle
            build: "16428233"
            version: "37.2.12"
            gpu: swangle
    env:
      MIANCAK_SCRIPT_TIMEOUT_SECONDS: "900"
      MIANCAK_EMULATOR_GPU_API23: ${{ matrix.gpu }}
      MIANCAK_DIAGNOSTIC_EMULATOR_VERSION: ${{ matrix.version }}
      MIANCAK_DIAGNOSTIC_EMULATOR_BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check three real kernel restarts
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          system-image-api-level: 23
          emulator-build: ${{ matrix.build }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-reboot-smoke
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: python3 scripts/emulator_reboot_smoke.py --timeout-seconds 900
      - name: Preserve reboot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api23-${{ matrix.profile }}-trial-${{ matrix.trial }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

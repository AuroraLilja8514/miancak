name: MIANCAK dummy preview readiness

on:
  push:
    branches: [master]
    paths:
      - .github/release-requests/_protected-preview-readiness-probe-v2.json

permissions: {}
concurrency:
  group: miancak-dummy-preview-readiness
  cancel-in-progress: false

jobs:
  admit:
    name: Rehearse Contents-only admission
    if: >-
      github.repository == 'AuroraLilja8514/miancak' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.ref_protected && github.run_attempt == 1 &&
      github.actor_id == '315702774' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify protected dummy merge and bounded read routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/protected-preview/preview_readiness.py admit --timeout-seconds 75

  signer:
    name: Rehearse signer
    needs: admit
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/protected-preview-readiness-signer.yml

  publisher:
    name: Rehearse publisher
    needs: admit
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/protected-preview-readiness-publisher.yml

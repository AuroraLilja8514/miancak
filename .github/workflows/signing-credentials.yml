name: Signing credential checks

on:
  push:
    branches: [master, test/signing-credentials]
    paths: [.github/workflows/signing-credentials.yml, tools/signing/**, docs/signing/**]
  pull_request:
    paths: [.github/workflows/signing-credentials.yml, tools/signing/**, docs/signing/**]
  workflow_dispatch:
    inputs:
      test_formal_credentials:
        description: 'Test MIANCAK credentials after checking release-signing protection rules'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signing-credentials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  self-test:
    name: disposable credentials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Get the tested native Windows generator for disposable fixtures
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: AuroraLilja8514/miancak
          ref: fc72646d2a52d8b627cdbd108cd0c9efc17fe6e5
          path: fixture-generator
          persist-credentials: false
      - name: Exercise the exact embedded checker without formal credentials
        env:
          JAVA_TOOL_OPTIONS: ''
          _JAVA_OPTIONS: ''
          JDK_JAVA_OPTIONS: ''
        run: python tools/signing/test_credential_probe.py

  formal-credential-probe:
    name: protected MIANCAK credential proof
    needs: self-test
    if: >-
      github.repository == 'AuroraLilja8514/miancak' &&
      github.ref == 'refs/heads/master' &&
      github.workflow_ref == 'AuroraLilja8514/miancak/.github/workflows/signing-credentials.yml@refs/heads/master' &&
      ((github.event_name == 'push' && github.event.deleted == false) ||
       (github.event_name == 'workflow_dispatch' && inputs.test_formal_credentials == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment:
      name: release-signing
    env:
      JAVA_TOOL_OPTIONS: ''
      _JAVA_OPTIONS: ''
      JDK_JAVA_OPTIONS: ''
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Compile the reviewed inline checker before injecting credentials
        run: |
          umask 077
          ulimit -c 0
          test -x "$JAVA_HOME_17_X64/bin/javac"
          test -x "$JAVA_HOME_17_X64/bin/java"
          mkdir -p "$RUNNER_TEMP/miancak-credential-probe"
          cat > "$RUNNER_TEMP/miancak-credential-probe/MiancakCredentialProbe.java" <<'JAVA'
          // MIANCAK_CREDENTIAL_PROBE_BEGIN
          import java.io.ByteArrayInputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PrivateKey;
          import java.security.SecureRandom;
          import java.security.Signature;
          import java.security.cert.X509Certificate;
          import java.security.interfaces.RSAPublicKey;
          import java.util.Arrays;
          import java.util.Base64;
          import java.util.Enumeration;
          import java.util.HexFormat;
          
          public final class MiancakCredentialProbe {
              public static void main(String[] args) {
                  String stage = "INPUT_INVALID";
                  byte[] encodedKey = null;
                  byte[] challenge = null;
                  byte[] proof = null;
                  char[] password = null;
                  PrivateKey privateKey = null;
                  boolean success = false;
                  try {
                      if (args.length != 0 || Runtime.version().feature() != 17) {
                          throw new IllegalArgumentException();
                      }
                      stage = "MISSING_KEYSTORE";
                      String base64 = System.getenv("MIANCAK_RELEASE_KEYSTORE_B64");
                      if (base64 == null || base64.isBlank()) throw new IllegalArgumentException();
                      stage = "MISSING_PASSWORD";
                      String passwordText = System.getenv("MIANCAK_RELEASE_STORE_PASSWORD");
                      if (passwordText == null || passwordText.isEmpty()) throw new IllegalArgumentException();
                      password = passwordText.toCharArray();
                      stage = "EXPECTED_FINGERPRINT_INVALID";
                      String expected = System.getenv("MIANCAK_EXPECTED_CERT_SHA256");
                      if (expected == null || !expected.matches("[0-9a-fA-F]{64}")) {
                          throw new IllegalArgumentException();
                      }
                      byte[] expectedDigest = HexFormat.of().parseHex(expected);
                      stage = "BASE64_INVALID";
                      if (base64.length() > 48 * 1024) throw new IllegalArgumentException();
                      encodedKey = Base64.getDecoder().decode(base64.replaceAll("[ \\t\\r\\n]", ""));
                      if (encodedKey.length == 0) throw new IllegalArgumentException();
          
                      stage = "PKCS12_LOAD_FAILED";
                      KeyStore store = KeyStore.getInstance("PKCS12");
                      try (ByteArrayInputStream input = new ByteArrayInputStream(encodedKey)) {
                          store.load(input, password);
                      }
                      stage = "ENTRY_SELECTION_FAILED";
                      Enumeration<String> aliases = store.aliases();
                      String selected = null;
                      int entryCount = 0;
                      while (aliases.hasMoreElements()) {
                          String alias = aliases.nextElement();
                          entryCount++;
                          if (store.entryInstanceOf(alias, KeyStore.PrivateKeyEntry.class)) {
                              if (selected != null) throw new IllegalArgumentException();
                              selected = alias;
                          }
                      }
                      if (entryCount != 1 || selected == null) throw new IllegalArgumentException();
                      if (!(store.getCertificate(selected) instanceof X509Certificate certificate)) {
                          throw new IllegalArgumentException();
                      }
                      if (store.getCertificateChain(selected) == null
                              || store.getCertificateChain(selected).length != 1) {
                          throw new IllegalArgumentException();
                      }
                      stage = "CERTIFICATE_MISMATCH";
                      byte[] actualDigest = MessageDigest.getInstance("SHA-256").digest(certificate.getEncoded());
                      if (!MessageDigest.isEqual(expectedDigest, actualDigest)) {
                          throw new IllegalArgumentException();
                      }
                      stage = "CERTIFICATE_POLICY_FAILED";
                      certificate.checkValidity();
                      if (!certificate.getSubjectX500Principal().equals(certificate.getIssuerX500Principal())
                              || !"1.2.840.113549.1.1.11".equals(certificate.getSigAlgOID())
                              || !(certificate.getPublicKey() instanceof RSAPublicKey publicKey)
                              || publicKey.getModulus().bitLength() != 3072
                              || certificate.getBasicConstraints() != -1) {
                          throw new IllegalArgumentException();
                      }
                      boolean[] usage = certificate.getKeyUsage();
                      if (usage != null && (usage.length == 0 || !usage[0])) throw new IllegalArgumentException();
                      certificate.verify(certificate.getPublicKey());
          
                      stage = "PRIVATE_KEY_PROOF_FAILED";
                      Key key = store.getKey(selected, password);
                      if (!(key instanceof PrivateKey) || !"RSA".equals(key.getAlgorithm())) {
                          throw new IllegalArgumentException();
                      }
                      privateKey = (PrivateKey) key;
                      byte[] domain = "MIANCAK credential availability proof v1\0".getBytes(StandardCharsets.US_ASCII);
                      byte[] nonce = new byte[32];
                      new SecureRandom().nextBytes(nonce);
                      challenge = new byte[domain.length + nonce.length];
                      System.arraycopy(domain, 0, challenge, 0, domain.length);
                      System.arraycopy(nonce, 0, challenge, domain.length, nonce.length);
                      Arrays.fill(nonce, (byte) 0);
                      Signature signer = Signature.getInstance("SHA256withRSA");
                      signer.initSign(privateKey);
                      signer.update(challenge);
                      proof = signer.sign();
                      Signature verifier = Signature.getInstance("SHA256withRSA");
                      verifier.initVerify(certificate.getPublicKey());
                      verifier.update(challenge);
                      if (!verifier.verify(proof)) throw new IllegalArgumentException();
                      challenge[challenge.length - 1] ^= 1;
                      verifier.initVerify(certificate.getPublicKey());
                      verifier.update(challenge);
                      if (verifier.verify(proof)) throw new IllegalArgumentException();
                      success = true;
                  } catch (Throwable ignored) {
                      // Only fixed stage codes leave this process: never exception messages or key material.
                      System.err.println("FAIL: " + stage);
                  } finally {
                      if (password != null) Arrays.fill(password, '\0');
                      if (encodedKey != null) Arrays.fill(encodedKey, (byte) 0);
                      if (challenge != null) Arrays.fill(challenge, (byte) 0);
                      if (proof != null) Arrays.fill(proof, (byte) 0);
                      if (privateKey != null) {
                          try { privateKey.destroy(); } catch (Exception ignored) { }
                      }
                  }
                  if (!success) System.exit(1);
                  System.out.println("PASS: PKCS12_PRIVATE_KEY_CERTIFICATE_PROOF");
              }
          }
          // MIANCAK_CREDENTIAL_PROBE_END
          JAVA
          "$JAVA_HOME_17_X64/bin/javac" -encoding UTF-8 -d "$RUNNER_TEMP/miancak-credential-probe" "$RUNNER_TEMP/miancak-credential-probe/MiancakCredentialProbe.java"

      - name: Check presence, decrypt in memory, pin the certificate and prove private-key use
        env:
          MIANCAK_RELEASE_KEYSTORE_B64: ${{ secrets.MIANCAK_RELEASE_KEYSTORE_B64 }}
          MIANCAK_RELEASE_STORE_PASSWORD: ${{ secrets.MIANCAK_RELEASE_STORE_PASSWORD }}
          MIANCAK_EXPECTED_CERT_SHA256: '3883a84d506b029db9d7cb6ddb7953c96ad3aa81a38e3e19290b3d50c4f9a26b'
        run: |
          umask 077
          ulimit -c 0
          timeout 90s "$JAVA_HOME_17_X64/bin/java" -XX:+DisableAttachMechanism -XX:-HeapDumpOnOutOfMemoryError -XX:ErrorFile=/dev/null -cp "$RUNNER_TEMP/miancak-credential-probe" MiancakCredentialProbe

      - name: Remove only the non-secret probe classes
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/miancak-credential-probe"

# Called only after the read-only exact-input gate has succeeded.
name: Accept authenticated MIANCAK preview
on:
  workflow_call:
    inputs:
      approval_sha256:
        required: true
        type: string
      approval_run_id:
        required: true
        type: string
      receipt_artifact_id:
        required: true
        type: string

permissions: {}
jobs:
  signer:
    name: Sign and test preview
    if: >-
      github.repository == 'AuroraLilja8514/miancak' &&
      github.workflow_ref == 'AuroraLilja8514/miancak/.github/workflows/protected-preview.yml@refs/heads/master' &&
      github.ref == 'refs/heads/master' && github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      PREVIEW_MODE: publish
      PREVIEW_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
      PREVIEW_APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
      PREVIEW_RECEIPT_ARTIFACT_ID: ${{ inputs.receipt_artifact_id }}
      JAVA_TOOL_OPTIONS: ''
      _JAVA_OPTIONS: ''
      JDK_JAVA_OPTIONS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Recheck owner approval and create the runner-local input identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/miancak-preview"
          mkdir "$stage"
          python3 tools/protected-preview/install_handoff_tools.py "$stage/tools"
          python3 tools/protected-preview/private_inputs.py recipient --stage "$stage" --timeout-seconds 90
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: input-recipient-proof
        with:
          subject-path: ${{ runner.temp }}/miancak-preview/recipient/recipient.json
          predicate-type: https://github.com/AuroraLilja8514/miancak/provenance/preview-handoff/v1
          predicate: '{"role":"input-recipient"}'
          show-summary: false
      - name: Stage only the public input recipient and its proof
        env:
          INPUT_RECIPIENT_PROOF: ${{ steps.input-recipient-proof.outputs.bundle-path }}
        run: cp -- "$INPUT_RECIPIENT_PROOF" "$RUNNER_TEMP/miancak-preview/recipient/proof.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-input-recipient-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/miancak-preview/recipient/recipient.json
            ${{ runner.temp }}/miancak-preview/recipient/proof.json
          retention-days: 1
          overwrite: false
          if-no-files-found: error
      - name: Decrypt and inspect exactly the approved private build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/miancak-preview"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' > "$stage/sdk.log" 2>&1
          python3 tools/protected-preview/private_inputs.py receive --stage "$stage" --timeout-seconds 420
          rm -- "$stage/identity.txt"
          mv -- "$stage/recipient" "$stage/input-recipient"
          python3 tools/protected-preview/handoff.py await-recipient --stage "$stage" --timeout-seconds 300
          python3 - "$stage" <<'PY'
          import pathlib, re, sys, textwrap
          root = pathlib.Path(sys.argv[1])
          workflow = pathlib.Path(".github/workflows/signing-credentials.yml").read_text()
          java = re.search(r"^          // MIANCAK_CREDENTIAL_PROBE_BEGIN\n(.*?)^          // MIANCAK_CREDENTIAL_PROBE_END$", workflow, re.M | re.S)
          assert java
          (root / "MiancakCredentialProbe.java").write_text(textwrap.dedent(java[1]))
          PY
          "$JAVA_HOME_17_X64/bin/javac" -encoding UTF-8 -d "$stage" "$stage/MiancakCredentialProbe.java"
      - name: Recheck exact owner grant, freshness and all plaintext bytes before secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/protected-preview/private_inputs.py pre-key --stage "$RUNNER_TEMP/miancak-preview" --timeout-seconds 90
      - name: Sign with the registered production certificate in runner-local staging
        env:
          MIANCAK_RELEASE_KEYSTORE_B64: ${{ secrets.MIANCAK_RELEASE_KEYSTORE_B64 }}
          MIANCAK_RELEASE_STORE_PASSWORD: ${{ secrets.MIANCAK_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          stage="$RUNNER_TEMP/miancak-preview"
          python3 tools/protected-preview/preview_ops.py sign --prepared "$stage/prepared" --folder "$stage/signed" --probe-classes "$stage"
      - name: Enable KVM for the Android 15 acceptance guest
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Require signed upgrade, online setup, offline input and reboot before handoff
        env:
          MIANCAK_TEST_DISPOSABLE_GUEST: 'true'
          MIANCAK_SCRIPT_TIMEOUT_SECONDS: '1200'
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 35
          system-image-api-level: 35
          emulator-build: '16428233'
          arch: x86_64
          target: google_apis
          avd-name: miancak-release-35
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-release-35.avd/config.ini"
          emulator-options: -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: >-
            cd "$RUNNER_TEMP/miancak-preview" &&
            umask 077 &&
            python3 "$GITHUB_WORKSPACE/tools/protected-preview/preview_device.py" prepared signed > acceptance-private.log 2>&1
      - name: Seal the accepted APK and encrypt it for the authenticated publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          stage="$RUNNER_TEMP/miancak-preview"
          python3 tools/protected-preview/preview_ops.py seal --folder "$stage/signed" --report "$stage/test-results/release/acceptance.json"
          python3 tools/protected-preview/handoff.py encrypt --stage "$stage" --timeout-seconds 260
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: ciphertext-proof
        with:
          subject-path: ${{ runner.temp }}/miancak-preview/ciphertext/accepted.age
          predicate-type: https://github.com/AuroraLilja8514/miancak/provenance/preview-handoff/v1
          predicate: '{"role":"ciphertext"}'
          show-summary: false
      - name: Stage the ciphertext and its attestation
        env:
          CIPHERTEXT_PROOF: ${{ steps.ciphertext-proof.outputs.bundle-path }}
        run: cp -- "$CIPHERTEXT_PROOF" "$RUNNER_TEMP/miancak-preview/ciphertext/proof.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-ciphertext-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/miancak-preview/ciphertext/accepted.age
            ${{ runner.temp }}/miancak-preview/ciphertext/proof.json
          overwrite: false
          if-no-files-found: error
          retention-days: 1
      - name: Clear runner-local signing and Android acceptance staging
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/miancak-preview"

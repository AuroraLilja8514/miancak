name: MIANCAK CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miancak-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: generated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Regenerate checked-in files
        shell: bash
        run: |
          python3 gen_layouts.py
          python3 scripts/gen_phonetic_pages.py
          python3 scripts/test_phonetic_pages.py
          python3 scripts/check_word_table_fixtures.py
          python3 scripts/audit_fn_baseline.py
          python3 scripts/test_fn_baseline.py
          python3 check_layout.py
          python3 srcs/compose/compile.py srcs/compose/{*.json,compose} > srcs/juloo.keyboard2/ComposeKeyData.java
          python3 gen_method_xml.py > res/xml/method.xml

      - name: Verify generated files are current
        run: git diff --exit-code

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache locked native sources
        uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}

      - name: Prepare pinned Rime sources and data
        run: python3 scripts/prepare_rime.py

      - name: Run unit tests and compile Android test driver
        run: |
          mkdir -p build/generated-resources/xml build/generated-resources/raw
          echo '<keyboard/>' > build/generated-resources/xml/latn_legacy_probe.xml
          echo '<keyboard/>' > build/generated-resources/raw/latn_legacy_probe.xml
          ./gradlew --no-daemon test compileDebugAndroidTestJavaWithJavac
          test ! -e build/generated-resources/xml/latn_legacy_probe.xml
          test ! -e build/generated-resources/raw/latn_legacy_probe.xml
          cmp srcs/layouts/miancak_qwerty.xml build/generated-resources/xml/miancak_qwerty.xml
          cmp srcs/layouts/miancak_qwerty.xml build/generated-resources/raw/miancak_qwerty.xml
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(path).getroot() for path in Path("build/test-results").rglob("TEST-*.xml")]
          for suite in suites:
              print(f"{suite.attrib['name']}: {suite.attrib['tests']} tests, {suite.attrib['failures']} failures, {suite.attrib['errors']} errors")
          print("Total unit tests:", sum(int(suite.attrib["tests"]) for suite in suites))
          PY

      - name: Verify tests did not leave stale generated files
        run: git diff --exit-code

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-results-${{ github.sha }}
          path: build/test-results/
          retention-days: 7

  build-debug:
    name: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache locked native sources
        uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}

      - name: Prepare pinned Rime sources and data
        run: python3 scripts/prepare_rime.py

      - name: Cache native build objects
        uses: actions/cache@v4
        with:
          path: |
            .cxx
            build/intermediates/cxx
          key: native-debug-objects-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt', 'native/rime_jni.cc', 'native/sources.lock.json', 'native/cmake/**') }}
          restore-keys: |
            native-debug-objects-${{ runner.os }}-
            native-objects-${{ runner.os }}-

      - name: Build debug APK and instrumented tests
        run: |
          ./gradlew --no-daemon -PmiancakVersionCode=2 assembleDebug
          mkdir -p build/word-upgrade-fixture
          cp build/outputs/apk/debug/*.apk build/word-upgrade-fixture/baseline.apk
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Verify packaged native runtime
        run: |
          python3 scripts/check_native_apk.py build/outputs/apk/debug/*.apk
          python3 scripts/check_native_apk.py build/word-upgrade-fixture/baseline.apk

      - name: Upload feature-enabled upgrade fixture
        uses: actions/upload-artifact@v7
        with:
          name: miancak-word-baseline-${{ github.sha }}
          path: build/word-upgrade-fixture/baseline.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: miancak-debug-${{ github.sha }}
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  build-release:
    name: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cache locked native sources
        uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}
      - name: Prepare pinned Rime sources and data
        run: python3 scripts/prepare_rime.py
      - name: Cache release native build objects
        uses: actions/cache@v4
        with:
          path: |
            .cxx
            build/intermediates/cxx
          key: native-release-objects-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt', 'native/rime_jni.cc', 'native/sources.lock.json', 'native/cmake/**') }}
          restore-keys: |
            native-release-objects-${{ runner.os }}-
            native-objects-${{ runner.os }}-
      - name: Build and verify minified release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          python3 scripts/check_native_apk.py build/outputs/apk/release/*.apk --release
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: miancak-unsigned-release-${{ github.sha }}
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  interaction-tests:
    name: interaction-tests (${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    needs: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download
      - name: Gather APKs
        run: |
          mkdir -p artifacts
          find artifacts-download -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android offline native and interaction tests
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-interactions
          force-avd-creation: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-interactions.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: MIANCAK_TEST_API=${{ matrix.api }} bash scripts/emulator_tests.sh
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-results-api-${{ matrix.api }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  word-pack-quality:
    name: word-pack-quality (${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    needs: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download
      - name: Gather APKs
        run: |
          mkdir -p artifacts
          find artifacts-download -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare pinned word packs through actual JNI
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-quality
          force-avd-creation: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-quality.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: MIANCAK_TEST_API=${{ matrix.api }} bash scripts/word_pack_quality_tests.sh
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: word-pack-quality-api-${{ matrix.api }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  first-install:
    name: first-install (${{ matrix.api }}, ${{ matrix.entry }})
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
        entry: [settings-first, ime-first]
    needs: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download
      - name: Gather delivered APKs
        run: |
          mkdir -p artifacts
          find artifacts-download -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Previously unused phone image and normal Android enablement
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-clean
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-clean.avd/config.ini"
          emulator-options: -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: MIANCAK_TEST_API=${{ matrix.api }} MIANCAK_ENTRY_ORDER=${{ matrix.entry }} bash scripts/first_install_tests.sh
      - name: Upload first-install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-install-api-${{ matrix.api }}-${{ matrix.entry }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  word-table-tests:
    name: word-table-tests (${{ matrix.api }})
    needs: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download/current
      - uses: actions/download-artifact@v8
        with:
          name: miancak-word-baseline-${{ github.sha }}
          path: artifacts-download/fixture
      - name: Gather actual APKs
        run: |
          mkdir -p artifacts
          find artifacts-download/current -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download/current -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
          cp artifacts-download/fixture/baseline.apk artifacts/word-baseline.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Import actual tables, replace APK and reboot
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-words
          force-avd-creation: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-words.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: MIANCAK_TEST_API=${{ matrix.api }} bash scripts/word_table_apk_tests.sh
      - name: Upload vocabulary acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: word-table-results-api-${{ matrix.api }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  build-upgrade-baseline:
    name: build-upgrade-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ca6c0b309306767e434ce922e4a3409c7093e8b9
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v4
        with:
          path: .native
          key: native-sources-${{ hashFiles('native/sources.lock.json') }}
      - run: python3 scripts/prepare_rime.py
      - uses: actions/cache@v4
        with:
          path: |
            .cxx
            build/intermediates/cxx
          key: upgrade-baseline-ca6c-x86_64-${{ runner.os }}
      - name: Build pinned old application APK
        run: |
          ./gradlew --no-daemon -PmiancakAbis=x86_64 assembleDebug
          mkdir -p baseline
          cp build/outputs/apk/debug/*.apk baseline/baseline.apk
          git rev-parse HEAD > baseline/source-commit.txt
          sha256sum baseline/baseline.apk > baseline/apk-sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: miancak-upgrade-baseline-${{ github.sha }}
          path: baseline/
          if-no-files-found: error
          retention-days: 7

  upgrade-tests:
    name: upgrade-tests (${{ matrix.api }})
    needs: [build-debug, build-upgrade-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v8
        with:
          name: miancak-debug-${{ github.sha }}
          path: artifacts-download/current
      - uses: actions/download-artifact@v8
        with:
          name: miancak-upgrade-baseline-${{ github.sha }}
          path: artifacts-download/baseline
      - name: Gather actual APKs
        run: |
          mkdir -p artifacts
          find artifacts-download/current -name '*androidTest.apk' -exec cp {} artifacts/app-debug-androidTest.apk \;
          find artifacts-download/current -name '*.apk' ! -name '*androidTest.apk' -exec cp {} artifacts/app-debug.apk \;
          cp artifacts-download/baseline/baseline.apk artifacts/baseline.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade actual APK and reboot guest
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          avd-name: miancak-upgrade
          force-avd-creation: true
          pre-emulator-launch-script: sed -i 's/^hw.keyboard=.*/hw.keyboard=no/' "$HOME/.android/avd/miancak-upgrade.avd/config.ini"
          disable-animations: true
          emulator-options: -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: bash scripts/upgrade_apk_tests.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upgrade-results-api-${{ matrix.api }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

name: MIANCAK CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miancak-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: generated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Regenerate checked-in files
        shell: bash
        run: |
          python3 gen_layouts.py
          python3 check_layout.py
          python3 srcs/compose/compile.py srcs/compose/{*.json,compose} > srcs/juloo.keyboard2/ComposeKeyData.java
          python3 gen_method_xml.py > res/xml/method.xml

      - name: Verify generated files are current
        run: git diff --exit-code

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Verify tests did not leave stale generated files
        run: git diff --exit-code

  build-debug:
    name: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: miancak-debug-${{ github.sha }}
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
